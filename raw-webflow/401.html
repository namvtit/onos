                 GSAP Scroll Counter Script 
  =========================================================
-->
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof gsap === "undefined") {
    console.error("Undefined GSAP");
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  const counters = gsap.utils.toArray(".count");
  if (!counters.length) return;

  // Sequentially animate each counter on scroll
  counters.forEach((el, idx) => {
    const raw = el.getAttribute("data-target") || el.textContent;
    const target = parseInt(String(raw).replace(/\D/g, ""), 10) || 0;
    const duration = Math.max(1, Math.min(3, (target / 200) * 2));
    const obj = { val: 0 };

    gsap.to(obj, {
      val: target,
      duration: duration,
      ease: "none",
      delay: idx * 0.15, // optional stagger
      scrollTrigger: {
        trigger: el,
        start: "top 80%",  // start animation when element is near viewport
        
      },
      onUpdate: () => {
        el.textContent = Math.floor(obj.val).toLocaleString();
      },
      onComplete: () => {
        el.textContent = target.toLocaleString();
      }
    });
  });
});
</script>
